  # ==================== Z.AI (ZHIPU AI) ====================
  # CODING API
  - model_name: zai-glm-5.3
    litellm_params:
      model: zai/glm-5.3
      api_key: os.environ/ZAI_API_KEY
      api_base: os.environ/ZAI_API_BASE
      drop_params: true
      input_cost_per_token: 0.0000014        # $1.40 / 1M
      output_cost_per_token: 0.0000044       # $4.40 / 1M
      cache_read_input_token_cost: 0.00000026  # $0.26 / 1M cached input

  # Prefixed alias avoids registry-known bare-name parameter handling.
  # strip_thinking also removes unsupported client thinking kwargs.
  - model_name: zai-glm-5.3-flash
    litellm_params:
      model: zai/glm-5.3-flash
      api_key: os.environ/ZAI_API_KEY
      api_base: os.environ/ZAI_API_BASE
      drop_params: true
      input_cost_per_token: 0.00000015       # $0.15 / 1M (promo $0.075 until 2026-09-09)
      output_cost_per_token: 0.0000005       # $0.50 / 1M (promo $0.25)
      cache_read_input_token_cost: 0.00000003  # $0.03 / 1M cached (promo $0.015)

  # ==================== HERMES VIRTUAL MODELS ====================
  # Virtual aliases for hermes profiles — swap backing model HERE, not in profiles.
  # Primary lanes back onto the Mistral Vibe key (MISTRAL_VIBE_KEY, .209 only;
  # swapped off the ChatGPT Plus subscription 2026-11-02 — chatgpt-gpt-6.1-sol /
  # chatgpt-gpt-6-luna / chatgpt-gpt-6-astra remain as manual choices).
  # Effort carriers: GLM lanes use extra_body.reasoning_effort (chat-completions
  # wire). Top-level reasoning_effort from clients is stripped for these IDs by
  # enforce_effort_policy (plan 261031).
  # Keep the existing Z.ai heartbeat -> DeepSeek fallback chains unchanged.
  # Swapped to Mistral Vibe backings 2026-11-02 (ChatGPT Plus retired from the
  # primary lanes; user-directed). GLM effort enum is low/high/max — the
  # Responses-API xhigh level has no equivalent here, plan drops xhigh→high.
  # Replayed assistant `reasoning` in history is stripped pre-routing by
  # strip_mistral_reasoning (Mistral strict schema 422s on it; Z.ai accepts
  # the echo, so zai-backed groups keep receiving it).
  # Official Mistral Vibe rate limits (provider docs, checked 2026-11-02):
  # zai-glm-5-3 32,000,000 TPM / 66.67 RPS; zai-glm-5-3-flash 10,666,666 TPM
  # / 22.22 RPS (limit block shared with/taken from deepseek-v4-1-flash-1017:
  # 10,000,000 TPM / 22.22 RPS). Fleet usage (~<=90k-token prompts, low RPM)
  # is orders of magnitude below — real 429s would be an incident, not noise.
  - model_name: hermes-tasks
    litellm_params:
      model: mistral/zai-glm-5-3-flash
      api_key: os.environ/MISTRAL_VIBE_KEY
      drop_params: true
      extra_body:
        reasoning_effort: high
      input_cost_per_token: 0.00000015         # $0.15 / 1M
      output_cost_per_token: 0.0000005         # $0.50 / 1M
      cache_read_input_token_cost: 0.00000003  # $0.03 / 1M cached

  - model_name: hermes-plan
    litellm_params:
      model: mistral/zai-glm-5-3
      api_key: os.environ/MISTRAL_VIBE_KEY
      drop_params: true
      extra_body:
        reasoning_effort: high
      input_cost_per_token: 0.0000014          # $1.40 / 1M
      output_cost_per_token: 0.0000044         # $4.40 / 1M
      cache_read_input_token_cost: 0.00000014  # $0.14 / 1M cached

  - model_name: hermes-execute
    litellm_params:
      model: mistral/zai-glm-5-3-flash
      api_key: os.environ/MISTRAL_VIBE_KEY
      drop_params: true
      extra_body:
        reasoning_effort: high
      input_cost_per_token: 0.00000015         # $0.15 / 1M
      output_cost_per_token: 0.0000005         # $0.50 / 1M
      cache_read_input_token_cost: 0.00000003  # $0.03 / 1M cached

  # Legacy coding pair (opencode repinned to hermes-plan/hermes-tasks
  # 2026-10-31); kept as manual/rollback names on the main-key allowlist.
  # Backing moved to FULL glm-5.3 2026-10-31 (user-directed — plan-grade
  # reasoning on the coding-plan lane; research note 261020_LLM-plan-research,
  # 2026-10-31 addendum). effort stays high (glm-5.3 lane rec = high).
  - model_name: hermes-coding-plan
    litellm_params:
      model: zai/glm-5.3
      api_key: os.environ/ZAI_API_KEY
      api_base: os.environ/ZAI_API_BASE
      drop_params: true
      extra_body:
        reasoning_effort: high
      input_cost_per_token: 0.0000014          # $1.40 / 1M (glm-5.3 list)
      output_cost_per_token: 0.0000044         # $4.40 / 1M
      cache_read_input_token_cost: 0.00000026  # $0.26 / 1M cached input

  # hermes-coding-execute — effort medium→high 2026-10-31: GLM-5.3(-Flash) has
  # NO medium (enum low/high/max); out-of-enum values silently fall back to the
  # DEFAULT MAX (research note 261020_LLM-plan-research, 2026-10-31 addendum)
  # — medium was accidentally the worst case, not a saving.
  - model_name: hermes-coding-execute
    litellm_params:
      model: zai/glm-5.3-flash
      api_key: os.environ/ZAI_API_KEY
      api_base: os.environ/ZAI_API_BASE
      drop_params: true
      extra_body:
        reasoning_effort: high
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000005
      cache_read_input_token_cost: 0.00000003

  # Swapped to Mistral Vibe 2026-11-02: zai-glm-5-3-flash is natively
  # multimodal (text+image in, verified live via the mistral-vibe-* twin).
  # Effort low: vision lane needs fast turnaround; GLM enum has no medium.
  # Rollback: openai/deepseek-flash (retired deepseek-v4-flash-vision-exp id
  # is still answered upstream). Old deepseek pricing kept for reference:
  # in $0.15 / out $0.60 / cache $0.003 per 1M (off-peak, 2026-10-13).
  - model_name: hermes-vision
    litellm_params:
      model: mistral/zai-glm-5-3-flash
      api_key: os.environ/MISTRAL_VIBE_KEY
      drop_params: true
      extra_body:
        reasoning_effort: low
      input_cost_per_token: 0.00000015         # $0.15 / 1M
      output_cost_per_token: 0.0000005         # $0.50 / 1M
      cache_read_input_token_cost: 0.00000003  # $0.03 / 1M cached

  # Virtual alias for the hermes fallback tier (fallback_providers #1 in all
  # hermes configs, via LITELLM_FALLBACK_API_KEY). Backing swappable HERE —
  # same params as hermes-vision / deepseek-flash above.
  - model_name: hermes-fallback
    litellm_params:
      model: openai/deepseek-flash
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      drop_params: true
      extra_body:
        reasoning_effort: high   # explicit pin 2026-10-31 (user-directed; deepseek
                                 # default is high too — pin survives an upstream
                                 # default change). Serves full agent lanes on failover.
      # pricing = deepseek-flash off-peak (checked 2026-10-13, same schedule
      # as hermes-vision above; peak x2 calls under-count in spend logs)
      input_cost_per_token: 0.00000015          # $0.15 / 1M off-peak (peak $0.30)
      output_cost_per_token: 0.0000006          # $0.60 / 1M off-peak (peak $1.20)
      cache_read_input_token_cost: 0.000000003  # $0.003 / 1M cache-hit (peak $0.006)

  # ---- Heartbeat lane twins (2026-10-31, user-directed) ----
  # Z.ai backings retained independently of the ChatGPT primary lanes. Two roles:
  # (a) hop-1 fallback targets; (b) separately routable heartbeat/cron traffic.
  # Deliberately NO fallbacks of their own: if zai is out, heartbeat calls
  # fail instead of silently burning deepseek PAYG. All three stay at high.
  - model_name: hermes-heartbeat-plan
    litellm_params:
      model: zai/glm-5.3
      api_key: os.environ/ZAI_API_KEY
      api_base: os.environ/ZAI_API_BASE
      drop_params: true
      extra_body:
        reasoning_effort: high
      input_cost_per_token: 0.0000014          # $1.40 / 1M (glm-5.3 list)
      output_cost_per_token: 0.0000044         # $4.40 / 1M
      cache_read_input_token_cost: 0.00000026  # $0.26 / 1M cached input

  - model_name: hermes-heartbeat-execute
    litellm_params:
      model: zai/glm-5.3-flash
      api_key: os.environ/ZAI_API_KEY
      api_base: os.environ/ZAI_API_BASE
      drop_params: true
      extra_body:
        reasoning_effort: high
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000005
      cache_read_input_token_cost: 0.00000003

  - model_name: hermes-heartbeat-tasks
    litellm_params:
      model: zai/glm-5.3-flash
      api_key: os.environ/ZAI_API_KEY
      api_base: os.environ/ZAI_API_BASE
      drop_params: true
      extra_body:
        reasoning_effort: high
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000005
