  # ==================== CHATGPT SUBSCRIPTION (Codex backend) ====================
  # ChatGPT Plus subscription (not OpenAI API) via litellm's chatgpt/ provider.
  # Auth: ONE shared auth.json at CHATGPT_TOKEN_DIR (/app/chatgpt-auth inside the
  # container; host dir litellm/chatgpt-auth, gitignored). Login is OAuth device
  # flow, done OUTSIDE the proxy; the refresh token is single-use and the file is
  # rewritten on refresh -> exactly ONE host may hold a copy. .209 only; the
  # oracle proxy has no auth file and serves these models as unavailable.
  # Endpoint: Responses API. /v1/chat/completions is bridged to Responses.
  # No cost-map price -> spend logs record $0 (subscription quota, not per-token
  # billing); token counts are still attributed. Use rpm_limit/tpm_limit on keys
  # for caps if needed.
  # Model IDs + quota checked against developers.openai.com/codex/{models,
  # pricing} on 2026-10-24 — all three usable on Plus (est. local msgs/5h:
  # astra 5-45, sol 15-160, luna 350-3000; ONE shared pool per 5h window +
  # unpublished weekly limits; shared with the human's own ChatGPT usage).
  # Retired: gpt-5.4, gpt-5.5.
  - model_name: chatgpt-gpt-6.1-sol
    litellm_params:
      model: chatgpt/gpt-6.1-sol
    model_info:
      mode: responses

  - model_name: chatgpt-gpt-6-luna
    litellm_params:
      model: chatgpt/gpt-6-luna
    model_info:
      mode: responses

  # Manual-only ChatGPT choices; no forced reasoning effort.
  # All three share the subscription's quota pool.
  - model_name: chatgpt-gpt-6-astra
    litellm_params:
      model: chatgpt/gpt-6-astra
    model_info:
      mode: responses

# ==================== GENERAL SETTINGS ====================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # --- request/response payload storage + retention (added 2026-09-07) ---
  store_prompts_in_spend_logs: true
  maximum_spend_logs_retention_period: "90d"

# ==================== LITELLM SETTINGS ====================
litellm_settings:
    modify_params: true            # Auto-handle missing reasoning_content/thinking_blocks in multi-turn conversations
    check_provider_endpoint: true   # Queries upstream provider's /models endpoint to resolve wildcards (e.g. openai/*)
    # Production failover — 2-hop chains since 2026-10-31 (user-directed):
    # primary zai lane -> heartbeat twin (same upstream, separate deployment =
    # separate cooldown bucket) -> hermes-fallback (openai/deepseek-flash,
    # pay-per-token) INSIDE the proxy. hermes-heartbeat-* deliberately get NO
    # chain of their own: if zai is out, heartbeat calls fail instead of
    # silently burning deepseek PAYG. Ordered in-list iteration verified on
    # litellm v1.103.2 (router_utils/fallback_event_handlers.py::
    # run_async_fallback `for mg in fallback_model_group`, first success wins;
    # a hop with no fallback entry propagates to the next list entry).
    # hermes-vision gets no chain: it IS deepseek-flash already.
    # `fallbacks:` is a LIST of single-key mappings. Failover/recovery pings
    # via fallback_notify.py (gotify).
    fallbacks:
      - hermes-plan: ["hermes-heartbeat-plan", "hermes-fallback"]
      - hermes-execute: ["hermes-heartbeat-execute", "hermes-fallback"]
      - hermes-tasks: ["hermes-heartbeat-tasks", "hermes-fallback"]
      - hermes-coding-plan: ["hermes-heartbeat-plan", "hermes-fallback"]
      - hermes-coding-execute: ["hermes-heartbeat-execute", "hermes-fallback"]
    num_retries: 3                  # Default number of retries per request before giving up
    request_timeout: 300            # Max total time (seconds) for any request before timing out
    cooldown_time: 600              # how long to skip a deployment after too many failures
    retry_policy:                   # Per-request: how many times to retry specific error types
      TimeoutErrorRetries: 3        #   Retry x times on timeout before moving on
      RateLimitErrorRetries: 3      #   Retry x times on rate limit (429) before moving on
    allowed_fails_policy:           # Per-deployment: total failures across all requests before cooldown
      TimeoutErrorAllowedFails: 5   #   x timeout errors → deployment goes into cooldown
      RateLimitErrorAllowedFails: 5 #   x rate limit errors → deployment goes into cooldown

## this is used to strip specific words from system prompts
  # ^ format: <filename_without_.py>.<instance_variable_name>
    callbacks:
      - strip_hermes.strip_hermes_handler
      - fallback_notify.fallback_notifier
      - strip_thinking.strip_thinking_handler  # pop client-sent `thinking` for zai-backed groups (litellm #31084/#31085, opencode 1.17.9 always sends it)
      - codex_session_id.codex_session_id_hook  # stable sharded session ids for chatgpt/* groups -> backend prompt-cache reuse (plan 261026)
      - strip_mistral_reasoning.strip_mistral_reasoning_handler  # pop replayed assistant reasoning for mistral-backed groups (strict-schema 422, 2026-11-02) — must stay BEFORE enforce_effort_policy
      - enforce_effort_policy.effort_policy_handler  # managed-alias client-effort strip (plan 261031)


      # Optional: Disable SSL verification for self-signed certificates
  # ssl_verify: false

  # Optional: Enable caching
  # cache: true
  # cache_params:
  #   type: simple

  # Optional: Set drop params (for providers that don't support certain params)
  # drop_params: ["user", "messages"]  # Example: don't drop these
