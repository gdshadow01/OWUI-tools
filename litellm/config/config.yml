  # ==================== OPENROUTER ====================

  - model_name: openrouter-deepseek-v4-flash(0.14/0.28)
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY

  # ==================== DEEPSEEK ====================
  # deepseek-chat and deepseek-reasoner are deprecated;
  # both map to deepseek-v4-flash (non-thinking vs thinking mode).
  # deepseek-v4-flash supports both modes via parameter.
  # v4 pricing (checked 2026-08-31, api-docs.deepseek.com/quick_start/pricing):
  # PEAK Mon-Fri 01:00-04:00 & 06:00-10:00 UTC = 2x off-peak; all else off-peak.
  # Static costs encode OFF-PEAK (scheduled LLM usage targets off-peak; litellm
  # cannot vary price by time of day). Alias names keep their (now stale) price
  # suffixes — referenced as fallback model in hermes global + 6 profile configs.

  - model_name: deepseek-v4-flash(0.14/0.28)
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.00000022          # $0.22 / 1M off-peak (peak $0.44)
      output_cost_per_token: 0.00000066         # $0.66 / 1M off-peak (peak $1.32)
      cache_read_input_token_cost: 0.000000007  # $0.007 / 1M cache-hit (peak $0.014)

  - model_name: deepseek-v4-pro(0.435/0.87)
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.00000066          # $0.66 / 1M off-peak (peak $1.32)
      output_cost_per_token: 0.00000198         # $1.98 / 1M off-peak (peak $3.96)
      cache_read_input_token_cost: 0.000000011  # $0.011 / 1M cache-hit (peak $0.022)

  # ==================== MISTRAL AI ====================

  - model_name: mistral-mistral-large(0.5/1.5)
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY

  # --- Mistral "Vibe" key (MISTRAL_VIBE_KEY, separate allowance/key from
