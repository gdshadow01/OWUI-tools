services:
  websearch-mcp:
    build: .
    container_name: websearch-mcp
    restart: unless-stopped
    ports:
      - "0.0.0.0:9200:9200"
    environment:
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - SEARXNG_TIMEOUT=${SEARXNG_TIMEOUT:-15}
      - USE_SEARXNG_SEARCH=${USE_SEARXNG_SEARCH:-yes}
      - TIKA_SERVER_URL=${TIKA_SERVER_URL:-http://tika:9998}
      - PAGE_FETCH_TIMEOUT=${PAGE_FETCH_TIMEOUT:-15}
      - PAGE_MAX_CONTENT_LENGTH=${PAGE_MAX_CONTENT_LENGTH:-50000}
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_PORT=${MCP_PORT:-9200}
      - USE_REDDIT_BACKEND=${USE_REDDIT_BACKEND:-yes}
      - REDDIT_MIN_INTERVAL=${REDDIT_MIN_INTERVAL:-65}
      - REDDIT_CACHE_TTL=${REDDIT_CACHE_TTL:-600}
    env_file:
      - .env
    networks:
      - ollama-tools
      - searxng
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Tier-2 stealth-fetch sidecar: chromium exposing CDP, docker-internal only.
  # SECURITY: no ports: publish — CDP is unauthenticated and must never reach the LAN.
  # Image ENTRYPOINT is "chromium-browser --headless"; the command list appends to it.
  browser:
    image: zenika/alpine-chrome:latest
    container_name: browser
    init: true
    command:
      - --remote-debugging-port=9222
      - --remote-debugging-address=0.0.0.0
      - --user-data-dir=/home/chromium/profile
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
    mem_limit: 768m
    cpus: 1.0
    volumes:
      - ./browser-profile:/home/chromium/profile
    restart: unless-stopped
    networks:
      - ollama-tools
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
